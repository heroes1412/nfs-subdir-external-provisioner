apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs-client
provisioner: k8s-sigs.io/nfs-subdir-external-provisioner # must match deployment's PROVISIONER_NAME
reclaimPolicy: Delete
parameters:
  archiveOnDelete: "false"
  onDelete: "delete"
# Optional: Set mountOptions for client pods (e.g. nfsvers=4.2, noatime)
# mountOptions:
#   - nfsvers=4.2
#   - noatime
#   - hard
#   - timeo=600
#   - retrans=2
